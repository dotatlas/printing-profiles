openapi: 3.1.0
info:
  title: Printing Profiles API
  version: 0.1.0
  description: >-
    Every answer has an X-Request-ID header. Every error is RFC 9457 problem details.
    Every POST, PATCH and DELETE needs the site's Origin header, and a JSON body when it has one (403 or 415 otherwise).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check that the API is up
      security: [] # Public: no sign-in needed.
      responses:
        "200":
          description: The API is up.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/printers:
    get:
      operationId: listPrinters
      summary: List printers, with search and pages
      security: [] # Public: no sign-in needed.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of printers, in slug order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/materials:
    get:
      operationId: listMaterials
      summary: List filaments, with search, type and color filters and pages
      security: [] # Public: no sign-in needed.
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: type
          in: query
          description: Only filaments of this type.
          schema:
            $ref: "#/components/schemas/MaterialType"
        - name: color
          in: query
          description: Only filaments sold in a color whose name contains this text. Case does not matter.
          schema:
            type: string
            maxLength: 100
            example: black
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of filaments, in slug order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/slicers:
    get:
      operationId: listSlicers
      summary: List slicers, with search and pages
      security: [] # Public: no sign-in needed.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of slicers, in slug order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlicerPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me:
    patch:
      operationId: updateMe
      summary: Change the signed-in user's display name
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name:
                  type: string
                  maxLength: 60
      responses:
        "200":
          description: The user, with the new name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getMe
      summary: Show who is signed in
      security: [{session: []}]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me/onboarding:
    post:
      operationId: finishOnboarding
      summary: Choose a handle and accept the terms (one time)
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handle, accept_terms]
              properties:
                handle:
                  type: string
                  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
                  minLength: 3
                  maxLength: 30
                accept_terms:
                  type: boolean
                  const: true
      responses:
        "200":
          description: The user, with the handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          description: The handle is taken, or this account already has one.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me/identities:
    get:
      operationId: listMyIdentities
      summary: List the ways the signed-in user can sign in
      security: [{session: []}]
      responses:
        "200":
          description: The sign-in methods, the oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me/identities/{id}:
    delete:
      operationId: deleteMyIdentity
      summary: Remove a sign-in method (never the last one)
      security: [{session: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: It is the user's only way to sign in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      summary: List the signed-in user's sessions
      security: [{session: []}]
      responses:
        "200":
          description: The sessions that are still valid, the most recent first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me/sessions/{id}:
    delete:
      operationId: deleteMySession
      summary: End one of the signed-in user's sessions
      security: [{session: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The session is ended. When it is the current one, the cookie is cleared too.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/signout:
    post:
      operationId: signOut
      summary: End the session of this request
      security: [{session: []}, {}]
      responses:
        "204":
          description: Signed out (also when no one was signed in). The cookie is cleared.
        "403":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/signout-all:
    post:
      operationId: signOutEverywhere
      summary: End every session of the signed-in user
      security: [{session: []}]
      responses:
        "204":
          description: Every session is ended. The cookie is cleared.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/{provider}/start:
    get:
      operationId: startOAuthSignIn
      summary: Start a sign-in with GitHub or Discord
      description: >-
        A browser navigation, not a fetch. It sets a short state cookie and redirects to the provider with a
        state and a PKCE S256 challenge. With link=1, a signed-in user adds the provider to the account.
      security: [] # Public: it is the sign-in. With link=1 it needs the session.
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ReturnPath"
        - name: link
          in: query
          description: Set to 1 to add this provider to the signed-in user.
          schema:
            type: string
            enum: ["1"]
      responses:
        "302":
          description: To the provider's sign-in page.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/{provider}/callback:
    get:
      operationId: finishOAuthSignIn
      summary: Finish a sign-in (the provider sends the browser here)
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        "303":
          description: >-
            To the return path on the site, signed in. On an error, to /signin?error=cancelled|provider|link-session,
            or /settings?error=linked-elsewhere.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/start:
    post:
      operationId: startEmailSignIn
      summary: Email a one-time sign-in link
      description: >-
        The answer is the same for every valid address, so it tells nobody which addresses have accounts.
        The link works one time, for 15 minutes. Limits: 5 an hour for one address, 20 an hour for one IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                return:
                  type: string
                  maxLength: 200
                  description: The path on the site to go to after sign-in.
      responses:
        "202":
          description: The link is on its way.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: sent
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/finish:
    post:
      operationId: finishEmailSignIn
      summary: Sign in with the token from an email link
      description: The site's link page sends this from a button, never on page load, because mail scanners open links.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Signed in. The session cookie is set.
          content:
            application/json:
              schema:
                type: object
                required: [return]
                properties:
                  return:
                    type: string
                    description: The path on the site to go to now.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/fake/start:
    get:
      operationId: fakeSignIn
      summary: Sign in as a test user (development only)
      description: This route exists only when ENV is dev. It signs in with no provider, for tests and local work.
      security: [] # Public: it is the sign-in.
      parameters:
        - name: login
          in: query
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            maxLength: 40
        - $ref: "#/components/parameters/ReturnPath"
      responses:
        "303":
          description: Signed in. The session cookie is set, and Location is the return path on the site.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
      description: The session cookie that a sign-in sets. It is HttpOnly, so scripts cannot read it.
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: A provider is available only when the API has an OAuth app for it.
      schema:
        type: string
        enum: [github, discord]
    ReturnPath:
      name: return
      in: query
      description: The path on the site to go back to after sign-in. Anything that is not a plain path becomes "/".
      schema:
        type: string
        maxLength: 200
        default: /
    Search:
      name: q
      in: query
      description: Search words. Every word must appear, in any order, and case does not matter.
      schema:
        type: string
        maxLength: 100
    Cursor:
      name: cursor
      in: query
      description: The next_cursor value from the page before. Leave it out for the first page.
      schema:
        type: string
        maxLength: 100
    Limit:
      name: limit
      in: query
      description: The number of items on one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    RequestID:
      description: A random ID for this request. The API also writes it in its log line for the request.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  responses:
    Problem:
      description: An error, in the RFC 9457 problem details format.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Brand:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          example: bambu-lab
        name:
          type: string
          example: Bambu Lab
    Printer:
      type: object
      required: [slug, model, brand]
      properties:
        slug:
          type: string
          example: bambu-lab-p1s
        model:
          type: string
          example: P1S
        brand:
          $ref: "#/components/schemas/Brand"
    MaterialType:
      type: string
      enum: [PLA, PETG, ABS, ASA, TPU, PA, PC]
    Material:
      type: object
      required: [slug, product_name, type, diameter_mm, brand, colors]
      properties:
        slug:
          type: string
          example: prusa-research-prusament-petg
        product_name:
          type: string
          example: Prusament PETG
        type:
          $ref: "#/components/schemas/MaterialType"
        diameter_mm:
          type: number
          enum: [1.75, 2.85]
        brand:
          $ref: "#/components/schemas/Brand"
        colors:
          type: array
          description: The colors that this filament is sold in, in name order.
          items:
            $ref: "#/components/schemas/Color"
    Color:
      type: object
      required: [name, hex]
      properties:
        name:
          type: string
          example: Black
        hex:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          example: "#000000"
    Slicer:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          example: orcaslicer
        name:
          type: string
          example: OrcaSlicer
    PrinterPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Printer"
        next_cursor:
          type: string
          description: Send it as cursor to get the next page. It is missing on the last page.
    MaterialPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        next_cursor:
          type: string
          description: Send it as cursor to get the next page. It is missing on the last page.
    SlicerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Slicer"
        next_cursor:
          type: string
          description: Send it as cursor to get the next page. It is missing on the last page.
    Me:
      type: object
      required: [handle, display_name, needs_onboarding]
      properties:
        handle:
          type: string
          description: Empty until onboarding.
        display_name:
          type: string
        needs_onboarding:
          type: boolean
          description: True until the user picks a handle and accepts the terms.
    Identity:
      type: object
      required: [id, provider, created_at]
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum: [github, discord, email, fake]
        email:
          type: string
          description: Only for the email method.
        created_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [id, user_agent, created_at, last_seen_at, current]
      properties:
        id:
          type: integer
          format: int64
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Updated at most once an hour.
        current:
          type: boolean
          description: True for the session that made this request.
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Always "about:blank" for now; the title and status tell the error.
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          description: More about this error, when there is something useful and safe to say.
