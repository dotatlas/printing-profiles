openapi: 3.1.0
info:
  title: Printing Profiles API
  version: 0.1.0
  description: Every answer has an X-Request-ID header. Every error is RFC 9457 problem details.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check that the API is up
      security: [] # Public: no sign-in needed.
      responses:
        "200":
          description: The API is up.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/printers:
    get:
      operationId: listPrinters
      summary: List printers, with search and pages
      security: [] # Public: no sign-in needed.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of printers, in slug order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/materials:
    get:
      operationId: listMaterials
      summary: List filaments, with search, type and color filters and pages
      security: [] # Public: no sign-in needed.
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: type
          in: query
          description: Only filaments of this type.
          schema:
            $ref: "#/components/schemas/MaterialType"
        - name: color
          in: query
          description: Only filaments sold in a color whose name contains this text. Case does not matter.
          schema:
            type: string
            maxLength: 100
            example: black
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of filaments, in slug order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/slicers:
    get:
      operationId: listSlicers
      summary: List slicers, with search and pages
      security: [] # Public: no sign-in needed.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of slicers, in slug order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlicerPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Search:
      name: q
      in: query
      description: Search words. Every word must appear, in any order, and case does not matter.
      schema:
        type: string
        maxLength: 100
    Cursor:
      name: cursor
      in: query
      description: The next_cursor value from the page before. Leave it out for the first page.
      schema:
        type: string
        maxLength: 100
    Limit:
      name: limit
      in: query
      description: The number of items on one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    RequestID:
      description: A random ID for this request. The API also writes it in its log line for the request.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  responses:
    Problem:
      description: An error, in the RFC 9457 problem details format.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Brand:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          example: bambu-lab
        name:
          type: string
          example: Bambu Lab
    Printer:
      type: object
      required: [slug, model, brand]
      properties:
        slug:
          type: string
          example: bambu-lab-p1s
        model:
          type: string
          example: P1S
        brand:
          $ref: "#/components/schemas/Brand"
    MaterialType:
      type: string
      enum: [PLA, PETG, ABS, ASA, TPU, PA, PC]
    Material:
      type: object
      required: [slug, product_name, type, diameter_mm, brand, colors]
      properties:
        slug:
          type: string
          example: prusa-research-prusament-petg
        product_name:
          type: string
          example: Prusament PETG
        type:
          $ref: "#/components/schemas/MaterialType"
        diameter_mm:
          type: number
          enum: [1.75, 2.85]
        brand:
          $ref: "#/components/schemas/Brand"
        colors:
          type: array
          description: The colors that this filament is sold in, in name order.
          items:
            $ref: "#/components/schemas/Color"
    Color:
      type: object
      required: [name, hex]
      properties:
        name:
          type: string
          example: Black
        hex:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          example: "#000000"
    Slicer:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          example: orcaslicer
        name:
          type: string
          example: OrcaSlicer
    PrinterPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Printer"
        next_cursor:
          type: string
          description: Send it as cursor to get the next page. It is missing on the last page.
    MaterialPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        next_cursor:
          type: string
          description: Send it as cursor to get the next page. It is missing on the last page.
    SlicerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Slicer"
        next_cursor:
          type: string
          description: Send it as cursor to get the next page. It is missing on the last page.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Always "about:blank" for now; the title and status tell the error.
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          description: More about this error, when there is something useful and safe to say.
