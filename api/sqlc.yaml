# sqlc makes type-safe Go functions from the SQL in queries/, checked against the schema in migrations/.
# Run it from the repository root: see "Commands" in CLAUDE.md.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        overrides:
          # NOT NULL timestamps become time.Time, not pgtype.Timestamptz.
          - db_type: timestamptz
            go_type: time.Time
