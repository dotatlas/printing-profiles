name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code. Only the images job can write, to the container registry.
permissions:
  contents: read

# A newer push to a pull request cancels the older run. Every commit on main gets a full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # npm and npx install only versions that are at least 7 days old, also for the dependencies of the tools.
  NPM_CONFIG_MIN_RELEASE_AGE: 7

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The same image and credentials as docker-compose.yml, so the dev defaults of the API and the tests work.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: printing
          POSTGRES_PASSWORD: printing
          POSTGRES_DB: printing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U printing -d printing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Format
        run: |
          files=$(gofmt -l api)
          if [ -n "$files" ]; then echo "These files need gofmt: $files"; exit 1; fi
      - name: Vet
        run: go -C api vet ./...
      - name: Tests (race detector, real Postgres)
        run: go -C api test -race ./...
      - name: Known vulnerabilities
        run: go -C api run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Generated queries match the SQL
        run: docker run --rm -v "$PWD/api:/src" -w /src sqlc/sqlc:1.31.1 diff
      - name: API contract lint
        run: npx --yes @redocly/cli@2.62.1 lint api/openapi.yaml
      - name: Bruno against the running API
        run: |
          go -C api build -o "$RUNNER_TEMP/api" .
          "$RUNNER_TEMP/api" migrate
          "$RUNNER_TEMP/api" serve &
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS localhost:8080/api/v1/health
          cd bruno && npx --yes @usebruno/cli@4.2.1 run --env local

  web:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: API types match the contract
        run: npm run gen:api && git diff --exit-code lib/api-types.ts
      - name: Known vulnerabilities in the runtime packages
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Images
    # Only a push to main publishes images, and only after both checks pass. Pull requests never get here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web]
    # shortcut: x86_64 images only, use ubuntu-24.04-arm if production runs on arm64.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job is the only one that can write: it pushes to the GitHub container registry.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to the GitHub container registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API and site images
        # Each image gets the commit tag (to pin or roll back) and the main tag (the newest).
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          source="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          docker build --label "$source" -t "$repo/api:$GITHUB_SHA" -t "$repo/api:main" api
          docker build --label "$source" --build-arg SITE_URL=https://printingprofiles.com \
            -t "$repo/web:$GITHUB_SHA" -t "$repo/web:main" web
          for image in api web; do
            docker push "$repo/$image:$GITHUB_SHA"
            docker push "$repo/$image:main"
          done
